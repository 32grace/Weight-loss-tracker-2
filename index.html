```
:root {
  --bg: #0d0d0f;
  --bg2: #111114;
  --bg3: #0a0a0c;
  --border: #1e1e22;
  --border2: #2a2a2e;
  --text: #e8e4dc;
  --text2: #c8c4bc;
  --muted: #888;
  --muted2: #555;
  --green: #7ce08a;
  --red: #e07b7b;
  --orange: #e07b5a;
  --blue: #5ab8e0;
  --amber: #e0b85a;
  --mono: 'DM Mono', 'Courier New', monospace;
  --sans: 'Space Grotesk', sans-serif;
}

html, body {
  background: #0d0d0f !important;
  color: #e8e4dc !important;
  font-family: var(--mono);
  min-height: 100vh;
  overflow-x: hidden;
  color-scheme: dark;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
}
.logo { font-size: 28px; color: var(--green); line-height: 1; }
.header-text h1 {
  font-family: var(--sans);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.2em;
  color: #f0ece4;
}
.header-text p {
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--muted);
  text-transform: uppercase;
}
.saved-badge {
  margin-left: auto;
  background: #7ce08a22;
  color: var(--green);
  border: 1px solid #7ce08a44;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  letter-spacing: 0.1em;
  opacity: 0;
  transition: opacity 0.3s;
}
.saved-badge.show { opacity: 1; }

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 73px;
  z-index: 99;
}
.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: none;
  font-family: var(--mono);
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab.active { color: var(--green); border-bottom-color: var(--green); }

.page { display: none; padding: 20px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
.page.active { display: block; }

.week-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
}
.nav-btn {
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--muted);
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-family: var(--mono);
  flex-shrink: 0;
  touch-action: manipulation;
}
.week-info { flex: 1; text-align: center; }
.week-tag {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--muted2);
  text-transform: uppercase;
  display: block;
  margin-bottom: 2px;
}
.week-date { font-size: 13px; color: var(--text2); font-weight: 500; }
.current-pill {
  display: inline-block;
  font-size: 9px;
  background: #7ce08a22;
  color: var(--green);
  border: 1px solid #7ce08a33;
  padding: 2px 7px;
  border-radius: 20px;
  letter-spacing: 0.1em;
  margin-left: 6px;
}

/* ── DAY CARDS ── */
.day-cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.day-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  transition: border-color 0.2s;
}
.day-card.today { border: 2px solid #7ce08a !important; background: #0d1610; }
.day-card.future { border: 1.5px dashed #e0b85a55; background: #111210; }
.day-card.provisional { border: 2px dashed #e0b85a !important; background: #131208; }

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.day-header-left { display: flex; align-items: center; gap: 8px; }
.day-name {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.15em;
  color: var(--muted);
  text-transform: uppercase;
}
.today-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.provisional-badge {
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--amber);
  background: #e0b85a18;
  border: 1px solid #e0b85a44;
  border-radius: 4px;
  padding: 2px 6px;
}
.future-label {
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted2);
}
.day-net { font-size: 12px; font-weight: 700; color: var(--muted2); }
.day-net.positive { color: #7ce08a !important; }
.day-net.negative { color: #e07b7b !important; }
.day-net.prov-net { color: #e0b85a !important; }

.day-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.input-group label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--muted2);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.input-group input {
  width: 100%;
  background: #16161a;
  border: 1px solid var(--border2);
  border-radius: 8px;

  font-family: var(--mono);

  padding: 10px 12px;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}

.day-card.provisional .input-group input { border-color: #e0b85a33; }
.day-card.provisional .input-group input:focus { border-color: #e0b85a88; }

.prov-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.prov-toggle-label { font-size: 10px; letter-spacing: 0.1em; color: var(--muted2); text-transform: uppercase; }
.prov-toggle-label { font-size: 11px; letter-spacing: 0.1em; color: #a0a0a8; text-transform: uppercase; }
.prov-toggle-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #1e1e24;
  border: 1.5px solid #3a3a42;
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: #a0a0a8;
  touch-action: manipulation;
  transition: all 0.15s;
  min-width: 80px;
  justify-content: center;
}
.prov-toggle-btn.on { border-color: #e0b85a; color: #e0b85a !important; background: #2a2010; }
.toggle-dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex-shrink: 0; transition: background 0.15s; }
.prov-toggle-btn.on .toggle-dot { background: #e0b85a; }

/* ── PROVISIONAL INFO BANNER ── */
.prov-banner {
  background: #131208;
  border: 1px dashed #e0b85a55;
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 10px;
  color: var(--amber);
  letter-spacing: 0.08em;
  display: none;
}

/* ── SUMMARY CARDS ── */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.summary-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}
.summary-card.prov-card { border-color: #e0b85a44; background: #131208; }
.accent-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 12px 12px 0 0;
  opacity: 0.8;
}
.s-label { font-size: 9px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.s-value { font-family: var(--sans); font-size: 18px; font-weight: 700; }
.s-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

/* ── ALL TIME ── */
.big-stat {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  text-align: center;
  margin-bottom: 16px;
}
.big-num { font-family: var(--sans); font-size: 56px; font-weight: 800; color: #7ce08a !important; letter-spacing: -0.03em; line-height: 1; }
.big-unit { font-size: 24px; opacity: 0.7; margin-left: 4px; }
.big-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.mini-stat {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.ml { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.mv { font-size: 14px; font-weight: 700; color: var(--text2); font-family: var(--sans); }
.section-title { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted2); margin: 16px 0 10px; font-weight: 500; }
.week-history { display: flex; flex-direction: column; gap: 8px; }
.week-history-row {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  touch-action: manipulation;
}
.week-history-row.active { border-color: #7ce08a55; background: #0f1a10; }
.week-history-row.has-prov { border-style: dashed; border-color: #e0b85a44; }
.whr-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.whr-net { font-size: 12px; font-weight: 700; }
.whr-prov { font-size: 9px; color: var(--amber); letter-spacing: 0.1em; margin-top: 2px; }
.whr-loss { font-family: var(--sans); font-size: 15px; font-weight: 800; }
.empty-state { text-align: center; color: var(--muted2); font-size: 13px; padding: 40px 0; }

<body>

<header>
  <div class="logo">⬡</div>
  <div class="header-text">
    <h1>DEFICIT</h1>
    <p>Weight Loss Tracker</p>
  </div>
  <div class="saved-badge" id="savedBadge">✓ Saved</div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('weekly')">📅 Weekly</button>
  <button class="tab" onclick="switchTab('alltime')">📊 All-Time</button>
</div>

<div class="page active" id="page-weekly">
  <div class="week-nav">
    <button class="nav-btn" onclick="changeWeek(-1)">←</button>
    <div class="week-info">
      <span class="week-tag">Week</span>
      <span class="week-date" id="weekLabel">—</span>
      <span class="current-pill" id="currentPill" style="display:none">Now</span>
    </div>
    <button class="nav-btn" onclick="changeWeek(1)">→</button>
  </div>
  <div class="prov-banner" id="provBanner">⚡ Some days are marked provisional — planned figures, not yet confirmed.</div>
  <div class="day-cards" id="dayCards"></div>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<div class="page" id="page-alltime">
  <div class="big-stat">
    <div class="big-num" id="allTimeKg">0.00<span class="big-unit">kg</span></div>
    <div class="big-label" id="allTimeLabel">total lost</div>
  </div>
  <div class="mini-stat">
    <span class="ml">Total Deficit</span>
    <span class="mv" id="allTimeNet">0 kcal</span>
  </div>
  <div class="mini-stat" id="provStatRow" style="display:none">
    <span class="ml" style="color:var(--amber)">⚡ Inc. Provisional</span>
    <span class="mv" id="allTimeNetProv" style="color:var(--amber)">—</span>
  </div>
  <p class="section-title">Week by Week</p>
  <div class="week-history" id="weekHistory"></div>
</div>

<script>
  const STORAGE_KEY = 'deficit-tracker-v1';
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let state = { weeks: {}, activeWeek: getWeekKey(new Date()) };

  function getWeekKey(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    d.setDate(diff);
    return d.toISOString().split('T')[0];
  }

  function getWeekDates(wk) {
    return Array.from({length:7}, (_,i) => {
      const d = new Date(wk);
      d.setDate(d.getDate() + i);
      return d.toISOString().split('T')[0];
    });
  }

  function formatWeekLabel(wk) {
    const start = new Date(wk), end = new Date(wk);
    end.setDate(end.getDate() + 6);
    const o = {day:'numeric', month:'short'};
    return `${start.toLocaleDateString('en-GB',o)} – ${end.toLocaleDateString('en-GB',o)}`;
  }

  function todayStr() { return new Date().toISOString().split('T')[0]; }
  function isFuture(d) { return d > todayStr(); }
  function isToday(d) { return d === todayStr(); }
  function getCurrentWeekKey() { return getWeekKey(new Date()); }

  function ensureWeek(wk) {
    if (!state.weeks[wk]) {
      state.weeks[wk] = {};
      getWeekDates(wk).forEach(d => { state.weeks[wk][d] = {eaten:'', burned:'', provisional:false}; });
    } else {
      getWeekDates(wk).forEach(d => {
        if (!state.weeks[wk][d]) state.weeks[wk][d] = {eaten:'', burned:'', provisional:false};
        if (state.weeks[wk][d].provisional === undefined) state.weeks[wk][d].provisional = false;
      });
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.weeks));
      const b = document.getElementById('savedBadge');
      b.classList.add('show');
      setTimeout(() => b.classList.remove('show'), 1500);
    } catch(e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state.weeks = JSON.parse(raw);
    } catch(e) {}
    ensureWeek(state.activeWeek);
    render();
  }

  function changeWeek(offset) {
    const base = new Date(state.activeWeek);
    base.setDate(base.getDate() + offset * 7);
    state.activeWeek = getWeekKey(base);
    ensureWeek(state.activeWeek);
    render();
  }

  function jumpToWeek(wk) {
    state.activeWeek = wk;
    ensureWeek(wk);
    switchTab('weekly');
    render();
  }

  function handleInput(date, field, value) {
    state.weeks[state.activeWeek][date][field] = value;
    if (isFuture(date) && (parseFloat(value) > 0)) {
      state.weeks[state.activeWeek][date].provisional = true;
    }
    renderDayCards();
    renderSummary();
    save();
  }

  function toggleProvisional(date) {
    state.weeks[state.activeWeek][date].provisional = !state.weeks[state.activeWeek][date].provisional;
    renderDayCards();
    renderSummary();
    save();
  }

  function render() {
    renderWeekHeader();
    renderDayCards();
    renderSummary();
    renderAllTime();
  }

  function renderWeekHeader() {
    document.getElementById('weekLabel').textContent = formatWeekLabel(state.activeWeek);
    document.getElementById('currentPill').style.display =
      state.activeWeek === getCurrentWeekKey() ? 'inline' : 'none';
  }

  function renderDayCards() {
    const dates = getWeekDates(state.activeWeek);
    const wd = state.weeks[state.activeWeek] || {};
    let anyProv = false;

    document.getElementById('dayCards').innerHTML = dates.map((date, i) => {
      const d = wd[date] || {eaten:'', burned:'', provisional:false};
      const eaten = parseFloat(d.eaten) || 0;
      const burned = parseFloat(d.burned) || 0;
      const net = burned - eaten;
      const future = isFuture(date);
      const today = isToday(date);
      const isProv = !!d.provisional;
      if (isProv) anyProv = true;

      let cardClass = 'day-card';
      if (today) cardClass += ' today';
      else if (isProv) cardClass += ' provisional';
      else if (future) cardClass += ' future';

      // Inline card border style to force Safari to apply it
      let cardInlineStyle = '';
      if (today && !isProv) cardInlineStyle = 'border: 2px solid #7ce08a !important; background: #0d1610;';
      else if (isProv) cardInlineStyle = 'border: 2px dashed #e0b85a; background: #131208;';
      else if (future) cardInlineStyle = 'border: 1.5px dashed #e0b85a55; background: #111210;';

      let netClass = 'day-net' + (isProv ? ' prov-net' : net > 0 ? ' positive' : net < 0 ? ' negative' : '');
      const netText = net !== 0 ? `${net > 0 ? '+' : ''}${net.toFixed(0)} kcal` : '—';

      let badge = '';
      if (today && !isProv) badge = '<span style="width:7px;height:7px;border-radius:50%;background:#7ce08a;display:inline-block;"></span>';
      else if (isProv) badge = '<span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#e0b85a;background:#e0b85a18;border:1px solid #e0b85a44;border-radius:4px;padding:2px 6px;">⚡ Provisional</span>';
      else if (future) badge = '<span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#555;">Upcoming</span>';

      let toggleRow = '';
      if (today || future || isProv) {
        const btnStyle = isProv
          ? 'display:inline-flex;align-items:center;gap:8px;background:#2a2010;border:2px solid #e0b85a;border-radius:20px;padding:8px 18px;font-family:inherit;font-size:13px;font-weight:600;color:#e0b85a;cursor:pointer;min-width:80px;justify-content:center;'
          : 'display:inline-flex;align-items:center;gap:8px;background:#222228;border:2px solid #4a4a55;border-radius:20px;padding:8px 18px;font-family:inherit;font-size:13px;font-weight:600;color:#a0a0b0;cursor:pointer;min-width:80px;justify-content:center;';
        const dotStyle = isProv
          ? 'width:9px;height:9px;border-radius:50%;background:#e0b85a;display:inline-block;flex-shrink:0;'
          : 'width:9px;height:9px;border-radius:50%;background:#555;display:inline-block;flex-shrink:0;';
        toggleRow = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #1e1e22;">
            <span style="font-size:11px;letter-spacing:0.1em;color:#a0a0a8;text-transform:uppercase;">Mark as provisional</span>
            <button style="${btnStyle}" onclick="toggleProvisional('${date}')">
              <span style="${dotStyle}"></span>${isProv ? 'On' : 'Off'}
            </button>
          </div>`;
      }

      return `
        <div class="${cardClass}" style="${cardInlineStyle}">
          <div class="day-header">
            <div class="day-header-left">
              <span class="day-name">${DAYS[i]}</span>${badge}
            </div>
            <span class="${netClass}" id="net-${date}">${netText}</span>
          </div>
          <div class="day-inputs">
            <div class="input-group">
              <label>🍽 Eaten (kcal)</label>
              <input type="text" inputmode="decimal" pattern="[0-9]*" min="0" placeholder="0"
                value="${d.eaten}" onchange="handleInput('${date}','eaten',this.value)" />
            </div>
            <div class="input-group">
              <label>🔥 Burned (kcal)</label>
              <input type="text" inputmode="decimal" pattern="[0-9]*" min="0" placeholder="0"
                value="${d.burned}" onchange="handleInput('${date}','burned',this.value)" />
            </div>
          </div>
          ${toggleRow}
        </div>`;
    }).join('');

    document.getElementById('provBanner').classList.toggle('show', anyProv);
  }

  function renderSummary() {
    const dates = getWeekDates(state.activeWeek);
    const wd = state.weeks[state.activeWeek] || {};
    let confE = 0, confB = 0, provE = 0, provB = 0, hasProv = false;

    dates.forEach(date => {
      const d = wd[date] || {};
      const eaten = parseFloat(d.eaten) || 0;
      const burned = parseFloat(d.burned) || 0;
      const isProv = !!d.provisional;
      const el = document.getElementById('net-' + date);
      if (el) {
        const net = burned - eaten;
        el.textContent = net !== 0 ? `${net > 0 ? '+' : ''}${net.toFixed(0)} kcal` : '—';
        el.className = 'day-net' + (isProv ? ' prov-net' : net > 0 ? ' positive' : net < 0 ? ' negative' : '');
      }
      if (isProv) { provE += eaten; provB += burned; hasProv = true; }
      else { confE += eaten; confB += burned; }
    });

    const confNet = confB - confE;
    const confLoss = confNet * 0.00013;
    const totalNet = confNet + (provB - provE);
    const totalLoss = totalNet * 0.00013;

    let cards;
    if (hasProv) {
      cards = [
        { label: 'Confirmed Eaten', value: `${confE.toFixed(0)} kcal`, color: '#e07b5a', sub: null, prov: false },
        { label: 'Confirmed Burned', value: `${confB.toFixed(0)} kcal`, color: '#5ab8e0', sub: null, prov: false },
        { label: 'Confirmed Net', value: `${confNet >= 0 ? '+' : ''}${confNet.toFixed(0)} kcal`,
          color: confNet >= 0 ? '#7ce08a' : '#e07b7b',
          sub: confNet > 0 ? 'deficit' : confNet < 0 ? 'surplus' : 'balanced', prov: false },
        { label: '⚡ Proj. End of Week', value: `${totalNet >= 0 ? '+' : ''}${totalNet.toFixed(0)} kcal`,
          color: '#e0b85a',
          sub: `est. ${Math.abs(totalLoss).toFixed(3)} kg ${totalLoss >= 0 ? 'lost' : 'gained'}`, prov: true },
      ];
    } else {
      cards = [
        { label: 'Total Eaten', value: `${confE.toFixed(0)} kcal`, color: '#e07b5a', sub: null, prov: false },
        { label: 'Total Burned', value: `${confB.toFixed(0)} kcal`, color: '#5ab8e0', sub: null, prov: false },
        { label: 'Weekly Net', value: `${confNet >= 0 ? '+' : ''}${confNet.toFixed(0)} kcal`,
          color: confNet >= 0 ? '#7ce08a' : '#e07b7b',
          sub: confNet > 0 ? 'deficit' : confNet < 0 ? 'surplus' : 'balanced', prov: false },
        { label: 'Est. Loss', value: `${Math.abs(confLoss).toFixed(3)} kg`,
          color: confLoss >= 0 ? '#7ce08a' : '#e07b7b',
          sub: confLoss >= 0 ? 'lost this week' : 'gained this week', prov: false },
      ];
    }

    document.getElementById('summaryGrid').innerHTML = cards.map(c => `
      <div class="summary-card ${c.prov ? 'prov-card' : ''}">
        <div class="accent-bar" style="background:${c.color}"></div>
        <div class="s-label">${c.label}</div>
        <div class="s-value" style="color:${c.color}">${c.value}</div>
        ${c.sub ? `<div class="s-sub">${c.sub}</div>` : ''}
      </div>`).join('');

    renderAllTime();
  }

  function renderAllTime() {
    let confNet = 0, totalWithProv = 0, anyProv = false;
    Object.keys(state.weeks).forEach(wk => {
      Object.values(state.weeks[wk]).forEach(d => {
        const net = (parseFloat(d.burned)||0) - (parseFloat(d.eaten)||0);
        if (d.provisional) { anyProv = true; totalWithProv += net; }
        else { confNet += net; totalWithProv += net; }
      });
    });

    const confLoss = confNet * 0.00013;
    const totalLoss = totalWithProv * 0.00013;

    document.getElementById('allTimeKg').innerHTML =
      `${Math.abs(confLoss).toFixed(2)}<span class="big-unit">kg</span>`;
    document.getElementById('allTimeLabel').textContent =
      confLoss >= 0 ? 'total lost' : 'total gained';
    document.getElementById('allTimeNet').textContent = `${confNet.toFixed(0)} kcal`;

    const provRow = document.getElementById('provStatRow');
    if (anyProv) {
      provRow.style.display = 'flex';
      document.getElementById('allTimeNetProv').textContent =
        `${totalWithProv.toFixed(0)} kcal → ${Math.abs(totalLoss).toFixed(2)} kg`;
    } else {
      provRow.style.display = 'none';
    }

    const sortedWeeks = Object.keys(state.weeks).sort();
    const historyEl = document.getElementById('weekHistory');
    if (sortedWeeks.length === 0) {
      historyEl.innerHTML = '<div class="empty-state">No data yet — start logging!</div>';
      return;
    }

    historyEl.innerHTML = sortedWeeks.map(wk => {
      let cE=0, cB=0, pE=0, pB=0, hasProv=false;
      Object.values(state.weeks[wk]).forEach(d => {
        if (d.provisional) { pE += parseFloat(d.eaten)||0; pB += parseFloat(d.burned)||0; hasProv=true; }
        else { cE += parseFloat(d.eaten)||0; cB += parseFloat(d.burned)||0; }
      });
      const net = cB - cE;
      const totalNet = net + (pB - pE);
      const loss = net * 0.00013;
      const isActive = wk === state.activeWeek;
      const nc = net >= 0 ? '#7ce08a' : '#e07b7b';
      const lc = loss >= 0 ? '#7ce08a' : '#e07b7b';
      return `
        <div class="week-history-row ${isActive?'active':''} ${hasProv?'has-prov':''}" onclick="jumpToWeek('${wk}')">
          <div>
            <div class="whr-label">${formatWeekLabel(wk)}</div>
            <div class="whr-net" style="color:${nc}">${net>=0?'+':''}${net.toFixed(0)} kcal</div>
            ${hasProv ? `<div class="whr-prov">⚡ proj: ${totalNet>=0?'+':''}${totalNet.toFixed(0)} kcal</div>` : ''}
          </div>
          <div class="whr-loss" style="color:${lc}">${loss>=0?'-':'+'}${Math.abs(loss).toFixed(3)} kg</div>
        </div>`;
    }).join('');
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => {
      t.classList.toggle('active', (i===0&&tab==='weekly')||(i===1&&tab==='alltime'));
    });
    document.getElementById('page-weekly').classList.toggle('active', tab==='weekly');
    document.getElementById('page-alltime').classList.toggle('active', tab==='alltime');
    if (tab==='alltime') renderAllTime();
  }

  load();
</script>
